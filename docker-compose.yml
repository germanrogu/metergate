services:
  db:
    image: postgres:16
    environment:
      # This bootstrap superuser is only ever used to run migrations
      # (MIGRATIONS_DATABASE_URL). Runtime app code connects as the
      # unprivileged metergate_app role created by the first migration,
      # so RLS policies can't be bypassed by the application itself.
      POSTGRES_USER: metergate_migrator
      POSTGRES_PASSWORD: metergate_migrator
      POSTGRES_DB: metergate
    ports:
      - '5434:5432'
    volumes:
      - metergate_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metergate_migrator']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/apps/api/node_modules
      - api_shared_node_modules:/workspace/packages/shared/node_modules
      - api_root_node_modules:/workspace/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    ports:
      - '3001:3000'
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
      - web_shared_node_modules:/workspace/packages/shared/node_modules
      - web_root_node_modules:/workspace/node_modules
    depends_on:
      - api

# Each service gets its own set of node_modules volumes (rather than
# sharing one across services) because npm workspaces hoists differently
# depending on which app triggered the install — a shared volume would be
# silently populated by whichever service starts first, hiding the other
# service's deps (e.g. web's jsdom would vanish behind api's hoisted tree).
volumes:
  metergate_db_data:
  api_node_modules:
  api_shared_node_modules:
  api_root_node_modules:
  web_node_modules:
  web_shared_node_modules:
  web_root_node_modules:
